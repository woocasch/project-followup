name: project-follow-up-dev

services:  
  keycloak.storage.projectfollowup.dev:
    container_name: keycloak.storage.projectfollowup.dev
    hostname: keycloak.storage.projectfollowup.dev
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=secret-password
      - MYSQL_DATABASE=keycloak
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=keycloak-password
    volumes:
      - type: volume
        source: keycloak-data
        target: /var/lib/mysql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "keycloak", "-pkeycloak-password"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  otel-collector.projectfollowup.dev:
    image: project-follow-up/otel-collector:local
    build:
      context: ./otel-collector
      dockerfile: Dockerfile
    container_name: otel-collector.projectfollowup.dev
    hostname: otel-collector.projectfollowup.dev
    restart: always
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
      - /var/log:/var/log:ro
      - otel-data:/tmp
    ports:
      - "4003:4317"
    # ports:
    #   - "4317:4317"   # OTLP gRPC receiver
    #   - "4318:4318"   # OTLP HTTP receiver
    #   - "8888:8888"   # Prometheus metrics
    #   - "8889:8889"   # Prometheus exporter metrics
    networks:
      - nginx-network
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak.projectfollowup.dev:
    container_name: keycloak.projectfollowup.dev
    hostname: keycloak.projectfollowup.dev
    image: quay.io/keycloak/keycloak:26.5
    command:
      - start
      - --hostname=http://localhost:4002
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --telemetry-endpoint=http://otel-collector.projectfollowup.dev:4317
      - --telemetry-service-name=project-follow-up-keycloak
      - --features=opentelemetry-logs
      - --telemetry-logs-enabled=true
      - --telemetry-logs-level=all
      - --telemetry-resource-attributes=deployment_environment=dev
      - --health-enabled=true
      # - --optimized
    ports:
      - "4002:8080"
    depends_on:
      keycloak.storage.projectfollowup.dev:
        condition: service_healthy
      otel-collector.projectfollowup.dev:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak.storage.projectfollowup.dev
      KC_DB_URL_PROPERTIES : '?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true'
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 'keycloak-password'
    restart: always
    networks:
      - keycloak-network
      - nginx-network
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      timeout: 10s
      retries: 10
      interval: 30s
      start_period: 60s

