name: project-follow-up

services:  
  bff:
    image: project-follow-up-bff:local
    container_name: project-follow-up-bff
    hostname: project-follow-up-bff
    restart: always
    networks:
      - nginx-network

  ui:
    image: project-follow-up-ui:local
    container_name: project-follow-up-ui
    hostname: project-follow-up-ui
    restart: always
    volumes:
      - ./ui/configuration.json:/usr/share/nginx/html/configuration.json
    depends_on:
      - bff
    networks:
      - nginx-network

  keycloak.storage:
    container_name: keycloak.storage
    hostname: keycloak.storage
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=secret-password
      - MYSQL_DATABASE=keycloak
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=keycloak-password
    volumes:
      - type: volume
        source: keycloak-data
        target: /var/lib/mysql
    networks:
      - keycloak-network

  keycloak:
    container_name: keycloak
    hostname: keycloak
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start
      - --hostname=http://localhost:5000/auth
      - --hostname-strict=false
      # - --optimized
    depends_on:
      - keycloak.storage
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak.storage
      KC_DB_URL_PROPERTIES : '?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true'
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 'keycloak-password'
    restart: always
    networks:
      - keycloak-network
      - nginx-network

  nginx:
    image: nginx:latest
    container_name: project-follow-up-nginx
    hostname: project-follow-up-nginx
    restart: always
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ui
      - bff
      - keycloak
    networks:
      - nginx-network

networks:
  keycloak-network:
    driver: bridge
  nginx-network:
    driver: bridge

volumes:
  keycloak-data: