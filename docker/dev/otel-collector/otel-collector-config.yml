# OTEL Collector configuration for Grafana Stack integration
# Sends traces, metrics, and logs via OTLP HTTP to grafana.monitoring.local
# Grafana can be used to visualize all data types

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  resource:
    attributes:
      - key: service.name
        from_attribute: service_name
        action: upsert
      - key: service.version
        from_attribute: service_version
        action: upsert
      - key: deployment.environment
        from_attribute: deployment_environment
        action: upsert

  # Transform logs to be compatible with Loki
  transform/logs:
    log_statements:
      - context: log
        statements:
          - set(attributes["@timestamp"], time_unix_nano)
          - set(attributes["log.level"], severity_text)
          - set(attributes["message"], body)

exporters:
  # OTLP HTTP exporter for traces, metrics, and logs
  otlphttp:
    endpoint: http://grafana.monitoring.local:4318
    tls:
      insecure: true

  # Debug exporter for troubleshooting
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp, debug]
    
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp, debug]
    
    logs:
      receivers: [otlp]
      processors: [resource, transform/logs, batch]
      exporters: [otlphttp, debug]

  extensions: []