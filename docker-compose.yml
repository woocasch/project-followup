name: project-follow-up

services:  
  bff:
    image: project-follow-up-bff:latest
    container_name: project-follow-up-bff
    hostname: project-follow-up-bff
    restart: always

  ui:
    image: project-follow-up-ui:latest
    container_name: project-follow-up-ui
    hostname: project-follow-up-ui
    restart: always
    depends_on:
      - bff

  nginx:
    image: nginx:latest
    container_name: project-follow-up-nginx
    hostname: project-follow-up-nginx
    restart: always
    ports:
      - "5000:80"
    volumes:
      - ./docker_files/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ui
      - bff