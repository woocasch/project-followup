name: project-follow-up-local

services:  
  bff.projectfollowup.local:
    image: project-follow-up/bff:local
    container_name: bff.projectfollowup.local
    hostname: bff.projectfollowup.local
    restart: unless-stopped
    environment:
      - Keycloak__baseAddress=http://keycloak.projectfollowup.local:8080
      - Keycloak__clientSecret=VEnJZr0wgpLr6KiQnt3LFD2HcPR2u66t
      - OpenTelemetry__OtlpEndpoint=http://otel-collector.projectfollowup.local:4317
      - OpenTelemetry__Environment=LocalDocker
      - Kurrent__ConnectionString=esdb://kurrent.projectfollowup.local:2113?tls=false
      - EventBus__connectionString=amqp://api-bff:api-bff@rabbitmq.projectfollowup.local:5672/projectfollowup
      - MailSettings__host=mailpit.projectfollowup.local
      - MailSettings__port=1025
      - MailSettings__username=mailuser
      - MailSettings__password=mailpassword
      - Mongo__ConnectionString=mongodb://root:password@mongo.projectfollowup.local:27017
    networks:
      - nginx-network
      - mongo-network
      - rabbitmq-network
      - monitoring
    profiles:
      - applications

  ui.projectfollowup.local:
    image: project-follow-up/ui:local
    container_name: ui.projectfollowup.local
    hostname: ui.projectfollowup.local
    restart: unless-stopped
    volumes:
      - ./ui/configuration.json:/usr/share/nginx/html/configuration.json
    depends_on:
      - bff.projectfollowup.local
    networks:
      - nginx-network
    profiles:
      - applications

  keycloaksetup.projectfollowup.local:
    image: project-follow-up/keycloaksetup:local
    container_name: keycloaksetup.projectfollowup.local
    hostname: keycloaksetup.projectfollowup.local
    restart: no
    environment:
      - SetupSettings__keycloakBaseUrl=http://keycloak.projectfollowup.local:8080
      - SetupSettings__masterAdminUserName=admin
      - SetupSettings__masterAdminPassword=admin
      - SetupSettings__projectFollowUpRealm__uiClient__redirectUrls__0=http://localhost:5000/*
      - SetupSettings__projectFollowUpRealm__uiClient__webOrigins__0=http://localhost:5000
      - SetupSettings__projectFollowUpRealm__adminUser__username=projectfollowup
      - SetupSettings__projectFollowUpRealm__adminUser__password=projectfollowup
      - SetupSettings__projectFollowUpRealm__adminUser__email=projectfollowup@localhost
    depends_on:
      - keycloak.projectfollowup.local
    networks:
      - keycloak-network
    profiles:
      - setup

  keycloak.storage.projectfollowup.local:
    container_name: keycloak.storage.projectfollowup.local
    hostname: keycloak.storage.projectfollowup.local
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=secret-password
      - MYSQL_DATABASE=keycloak
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=keycloak-password
    volumes:
      - type: volume
        source: keycloak-data
        target: /var/lib/mysql
    networks:
      - keycloak-network
    profiles:
      - services
      - storage

  keycloak.projectfollowup.local:
    container_name: keycloak.projectfollowup.local
    hostname: keycloak.projectfollowup.local
    image: quay.io/keycloak/keycloak:26.5
    command:
      - start
      - --hostname=https://localhost:5000/auth
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      # - --optimized
    depends_on:
      - keycloak.storage.projectfollowup.local
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak.storage.projectfollowup.local
      KC_DB_URL_PROPERTIES : '?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true'
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 'keycloak-password'
    restart: unless-stopped
    networks:
      - keycloak-network
      - nginx-network
      - monitoring
    profiles:
      - services

  otel-collector.projectfollowup.local:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector.projectfollowup.local
    hostname: otel-collector.projectfollowup.local
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
      - /var/log:/var/log:ro
      - otel-data:/tmp
    ports:
      - "5001:4317"
    # ports:
    #   - "4317:4317"   # OTLP gRPC receiver
    #   - "4318:4318"   # OTLP HTTP receiver
    #   - "8888:8888"   # Prometheus metrics
    #   - "8889:8889"   # Prometheus exporter metrics
    networks:
      - nginx-network
      - monitoring
    profiles:
      - services

  kurrent.projectfollowup.local:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest
    container_name: kurrent.projectfollowup.local
    hostname: kurrent.projectfollowup.local
    restart: unless-stopped
    command:
      - --insecure
      - --run-projections=All
    environment:
      - KURRENT_CLUSTER_SIZE=1
      - KURRENT_EXT_TCP_PORT=1113
      - KURRENT_EXT_HTTP_PORT=2113
      - KURRENT_ENABLE_ATOM_PUB_OVER_HTTP=true
      - EVENTSTORE_EnableAtomPubOverHttp=true
    ports:
      - "5002:2113"  # HTTP API
      - "5003:1113"  # TCP interface
    volumes:
      - kurrent-data:/var/lib/kurrentdb
      - kurrent-logs:/var/log/kurrentdb
    networks:
      - nginx-network
      - monitoring
    profiles:
      - services

  rabbitmq.projectfollowup.local:
    image: rabbitmq:4.2.3-management
    container_name: rabbitmq.projectfollowup.local
    hostname: rabbitmq.projectfollowup.local
    restart: unless-stopped
    ports:
      # AMQP – do komunikacji aplikacji (.NET / MassTransit)
      - "5004:5672"
      # Panel administracyjny RabbitMQ (UI)
      - "5005:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rabbitmq-network
    profiles:
      - services

  nginx.projectfollowup.local:
    image: nginx:latest
    container_name: nginx.projectfollowup.local
    hostname: nginx.projectfollowup.local
    restart: unless-stopped
    ports:
      - "5000:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/projectfollowup.local.pem:/etc/nginx/certs/projectfollowup.local.pem
      - ./nginx/projectfollowup.local-key.pem:/etc/nginx/certs/projectfollowup.local-key.pem
    depends_on:
      - ui.projectfollowup.local
      - bff.projectfollowup.local
      - keycloak.projectfollowup.local
    networks:
      - nginx-network
    profiles:
      - applications

  mailpit.projectfollowup.local:
    image: axllent/mailpit
    container_name: mailpit.projectfollowup.local
    hostname: mailpit.projectfollowup.local
    restart: unless-stopped
    ports:
      - "5006:8025"  # Web UI
      - "5007:1025"  # SMTP
    profiles:
      - services

  mongo.projectfollowup.local:
    container_name: mongo.projectfollowup.local
    hostname: mongo.projectfollowup.local
    image: mongo:8.2.4
    restart: unless-stopped
    networks:
      - mongo-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-configdb:/data/configdb
      - mongo-volume:/data/db
    profiles:
      - services
      - storage

  mongo-express.projectfollowup.local:
    container_name: mongo-express.projectfollowup.local
    hostname: mongo-express.projectfollowup.local
    image: mongo-express:1.0.2-20-alpine3.19
    ports:
      - 5008:8081
    restart: unless-stopped
    depends_on:
      - mongo.projectfollowup.local
    networks:
      - mongo-network
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo.projectfollowup.local:27017
      - ME_CONFIG_MONGODB_SERVER=mongo.projectfollowup.local
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    profiles:
      - services

networks:
  keycloak-network:
    driver: bridge
  mongo-network:
    driver: bridge
  rabbitmq-network:
    driver: bridge
  nginx-network:
    driver: bridge
  monitoring:
    external: true

volumes:
  keycloak-data:
  otel-data:
  kurrent-data:
  kurrent-logs:
  rabbitmq_data:
  mongo-configdb:
  mongo-volume: