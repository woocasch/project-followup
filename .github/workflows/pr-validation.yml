name: PR Validation

on:
  pull_request:
    branches: 
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  build-and-test-bff:
    name: Build and Test BFF
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore bff/ProjectFollowUp.slnx
      
    - name: Build BFF
      run: dotnet build bff/ProjectFollowUp.slnx --configuration Release --no-restore
      
    - name: Run Tests
      run: dotnet test bff/ProjectFollowUp.slnx --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults
      
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bff-test-results
        path: TestResults/*.trx

  build-and-test-ui:
    name: Build and Test UI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: ui
      
    - name: Run code formatting check
      run: npm run check
      working-directory: ui
      
    - name: Build UI
      run: npm run build
      working-directory: ui
      
    - name: Run tests
      run: npm run test -- --run --coverage
      working-directory: ui
      
    - name: Upload Test Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-coverage
        path: ui/coverage/

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [build-and-test-bff, build-and-test-ui]
    if: always()
    
    steps:
    - name: Check build results
      run: |
        echo "BFF Build: ${{ needs.build-and-test-bff.result }}"
        echo "UI Build: ${{ needs.build-and-test-ui.result }}"
        
        if [ "${{ needs.build-and-test-bff.result }}" != "success" ] || [ "${{ needs.build-and-test-ui.result }}" != "success" ]; then
          echo "❌ One or more builds failed"
          exit 1
        else
          echo "✅ All builds passed successfully"
        fi