services:
  otel-collector.projectfollowup.local:
    image: project-follow-up/otel-collector:local
    build:
      context: ./otel-collector
      dockerfile: Dockerfile
    container_name: otel-collector.projectfollowup.local
    hostname: otel-collector.projectfollowup.local
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
      - /var/log:/var/log:ro
      - otel-data:/tmp
    networks:
      - monitoring-network
      - monitoring
    profiles:
      - services
      - setup
      - applications
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak.projectfollowup.local:
    container_name: keycloak.projectfollowup.local
    hostname: keycloak.projectfollowup.local
    image: project-follow-up/keycloak:local
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command:
      - start
      - --hostname=https://localhost:5000/auth
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --telemetry-endpoint=http://otel-collector.projectfollowup.local:4317
      - --telemetry-service-name=project-follow-up-keycloak
      - --telemetry-logs-level=all
      - --telemetry-resource-attributes=deployment_environment=project-followup-local
      - --optimized
    depends_on:
      keycloak.storage.projectfollowup.local:
        condition: service_healthy
        restart: true
      otel-collector.projectfollowup.local:
        condition: service_healthy
        restart: true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_DB_URL_HOST: keycloak.storage.projectfollowup.local
      KC_DB_URL_PROPERTIES : '?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true'
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: 'keycloak-password'
    restart: unless-stopped
    networks:
      - auth-network
      - monitoring-network
    profiles:
      - services
      - setup
      - applications
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      timeout: 10s
      retries: 10
      interval: 30s
      start_period: 300s

  rabbitmq.projectfollowup.local:
    image: rabbitmq:4.2.3-management
    container_name: rabbitmq.projectfollowup.local
    hostname: rabbitmq.projectfollowup.local
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5002:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eda-network
      - monitoring-network
    profiles:
      - services
      - setup
      - applications
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      timeout: 30s
      retries: 10
      interval: 30s
      start_period: 60s

  mailpit.projectfollowup.local:
    image: axllent/mailpit
    container_name: mailpit.projectfollowup.local
    hostname: mailpit.projectfollowup.local
    restart: unless-stopped
    environment:
      - MP_SMTP_AUTH_FILE=/passwords.txt
      - MP_SMTP_REQUIRE_STARTTLS=true
      - MP_SMTP_TLS_CERT=sans:localhost
      - MP_SMTP_TLS_KEY=sans:localhost
    volumes:
      - ./mailpit/passwords.txt:/passwords.txt
    ports:
      - "5003:8025"  # Web UI
    networks:
      - apps-network
    profiles:
      - services
      - setup
      - applications
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s
